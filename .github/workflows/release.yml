name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify tag matches app version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/ProductionAssistant.App/ProductionAssistant.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $version."
          }
      - name: Verify editor bundle
        working-directory: src/ProductionAssistant.App/Assets/ReportEditor
        run: npm ci && npm run build
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore ProductionAssistant.sln -p:Platform=x64 -r win-x64
          dotnet test tests/ProductionAssistant.Tests/ProductionAssistant.Tests.csproj -c Release -p:Platform=x64 --no-restore
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/ProductionAssistant.App/ProductionAssistant.csproj -c Release -p:Platform=x64 --self-contained true --no-restore -o publish/Release
          Compress-Archive -Path publish/Release/* -DestinationPath "ProductionAssistant-$env:GITHUB_REF_NAME-win-x64.zip"
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "ProductionAssistant-$env:GITHUB_REF_NAME-win-x64.zip" --generate-notes --verify-tag
